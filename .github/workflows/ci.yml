name: GreenShift Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Backend Tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run Full Audit & Test Suite
        run: node tests/run_all_tests.js

      - name: Verify Strict RLS Multi-Tenant Security
        run: node tests/test_supabase_rls_security.js

      - name: Verify Comprehensive Audit Suite
        run: node tests/test_audit_verification_suite.js

      - name: Scan Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
